<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>今天能平安下班嗎</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first. Start + result pages scroll on a 聯絡簿 grid; the RPG is a fixed full-screen canvas with a task bar on top and a dialog sheet at the bottom. */
:root{
  --paper:#f7f8f3; --grid:#dfe6dc; --ink:#22303a; --muted:#5f6d73;
  --card:#ffffff; --line:#cfd8d2;
  --pen:#d23a2b; --pen-soft:#fbe4e0;
  --ok:#1f7a4d; --ok-soft:#dff1e7;
  --line-green:#06a74a; --mail:#2f5fa7;
  --skin:#f2c8a2; --hair:#3b2b24; --coat:#3f6f8f; --badge:#ffffff;
  --display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161c1f; --grid:#222b2f; --ink:#e7ece8; --muted:#9aa8ad; --card:#1f272b; --line:#334047;
  --pen:#ff6b5a; --pen-soft:#3a2220; --ok:#5fd39a; --ok-soft:#183126; --line-green:#22c55e; --mail:#7aa6ec; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#161c1f; --grid:#222b2f; --ink:#e7ece8; --muted:#9aa8ad; --card:#1f272b; --line:#334047;
  --pen:#ff6b5a; --pen-soft:#3a2220; --ok:#5fd39a; --ok-soft:#183126; --line-green:#22c55e; --mail:#7aa6ec; color-scheme:dark }

html,body{min-height:100%}
body{background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mail);outline-offset:2px}

.cover{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.kicker{font-size:13px;letter-spacing:.12em;color:var(--muted)}
.cover h1{font-size:clamp(30px,8.5vw,42px);line-height:1.25}
.cover h1 em{font-style:normal;color:var(--pen);background:linear-gradient(transparent 62%,var(--pen-soft) 62%)}
.lede{margin:0;color:var(--muted)}
.rules{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;font-size:15px}
.rules div{display:flex;gap:10px;align-items:flex-start}
.rules b{font-family:var(--display);font-weight:400;color:var(--pen);min-width:3.5em}
.fl{font-size:14px;color:var(--muted)}
input#nick{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
.maker{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start}
.pv{display:grid;justify-items:center;gap:8px;position:sticky;top:12px}
.pv canvas{width:112px;height:132px;image-rendering:pixelated;background:linear-gradient(#bfe3ff 0 70%,#62bb61 70%);border:1.5px solid var(--line);border-radius:10px}
.pv button{font-size:13px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px}
.og{display:grid;gap:6px;padding-block:8px;border-bottom:1px dashed var(--line)}
.og:last-child{border-bottom:0}
.og h3{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.ops{display:flex;flex-wrap:wrap;gap:6px}
.hair{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:2px 2px 0;display:grid;justify-items:center;font-size:11px;color:var(--muted)}
.hair canvas{width:40px;height:40px;image-rendering:pixelated}
.sw{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);padding:0}
.acc{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:14px}
.hair[aria-pressed="true"],.sw[aria-pressed="true"],.acc[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold, #ffd84a)}
@media (max-width:420px){.maker{grid-template-columns:minmax(0,1fr)}.pv{position:static;grid-template-columns:auto auto;align-items:end;justify-content:center}}
.go{background:var(--pen);color:#fff;border:0;border-radius:14px;padding:15px;font-family:var(--display);font-size:20px;width:100%}
.go:active{transform:translateY(1px)}
.alt{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:4px}

/* card mode */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:8px;border-bottom:1.5px dashed var(--line)}
.clock{display:flex;align-items:baseline;gap:8px;min-width:0}
.clock .t{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.clock .p{font-size:14px;color:var(--muted)}
.hearts{display:flex;gap:4px;align-items:center;flex:none}
.hearts svg{width:22px;height:22px}
.hearts .full{fill:var(--pen)} .hearts .empty{fill:none;stroke:var(--muted);stroke-width:1.6}
.scene{display:flex;flex-direction:column;gap:14px}
.where{font-size:15px;color:var(--muted)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;font-weight:700;color:#fff}
.bar.line{background:var(--line-green)} .bar.mail{background:var(--mail)}
.bar.usb,.bar.file,.bar.cloud{background:#4b5a63} .bar.phone{background:#2c3e48} .bar.fb{background:#3d5a98}
.inner{padding:14px;display:grid;gap:10px}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--grid);font-family:var(--display);flex:none}
.bubble{background:var(--grid);border-radius:4px 16px 16px 16px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.link{color:var(--mail);text-decoration:underline;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:4em 1fr;gap:4px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.addr{font-family:var(--mono);font-size:13px;background:var(--pen-soft);padding:1px 4px;border-radius:4px}
.subject{font-weight:700}
.att{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:13px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.att mark{background:var(--pen-soft);color:var(--pen)}
.files{display:flex;gap:16px;flex-wrap:wrap}
.fi{display:grid;justify-items:center;gap:4px;font-size:13px;width:84px;text-align:center}
.fi svg{width:56px;height:48px}
.call{text-align:center;padding:18px 14px;display:grid;gap:4px;background:linear-gradient(var(--card),var(--grid))}
.call .nm{font-family:var(--display);font-size:22px}
.call .sub{font-size:13px;color:var(--muted)}
.photo{height:110px;border-radius:10px;background:linear-gradient(160deg,#41566b,#8aa0b0 45%,#d4a24c);position:relative;overflow:hidden}
.photo span{position:absolute;left:10px;bottom:8px;right:10px;color:#fff;font-family:var(--display);font-size:19px;text-shadow:0 1px 6px #0008}
.q{font-family:var(--display);font-size:19px;line-height:1.4}
.choices{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;width:100%}
.ch .k{font-family:var(--mono);font-size:14px;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--pen);background:var(--pen-soft)}
.ch.dim{opacity:.5}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:8px;border:1.5px solid}
.fb.good{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--pen-soft);border-color:var(--pen)}
.fb h2{font-size:22px} .fb.good h2{color:var(--ok)} .fb.bad h2{color:var(--pen)}
.fb p{margin:0}
.tip{font-size:15px;border-top:1px dashed currentColor;padding-top:8px;color:var(--ink)}
.tip b{color:var(--muted);font-weight:500}
.strip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.strip b{color:var(--ink);font-weight:500}

/* RPG screen */
#rpg{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#3a5d3a;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rhud{background:var(--paper);color:var(--ink);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:6px;border-bottom:2px solid var(--ink)}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.quest{display:flex;gap:10px;align-items:center;background:#fff3c4;color:#2b2410;border:2px solid #2b2410;border-radius:10px;padding:8px 12px;font-size:17px;line-height:1.35;font-weight:700}
.quest .tag{font-family:var(--display);font-weight:400;background:#2b2410;color:#fff3c4;border-radius:6px;padding:1px 8px;font-size:14px;flex:none}
.quest.pulse{animation:qp .5s ease-out 2}
@keyframes qp{50%{transform:scale(1.03)}}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#2b2410;color:#fff3c4;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;pointer-events:none}
.dlg{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:#fffdf5;color:#22303a;border-top:3px solid #22303a;
  padding-block:14px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 20px #0004;color-scheme:light;
  --card:#ffffff;--grid:#e9eee7;--line:#cfd8d2;--ink:#22303a;--muted:#5f6d73;--pen:#d23a2b;--pen-soft:#fbe4e0;--ok:#1f7a4d;--ok-soft:#dff1e7;--mail:#2f5fa7}
.dlg .meta{display:flex;justify-content:space-between;font-size:13px;color:#5f6d73}
.dlg .meta b{font-family:var(--mono);color:#22303a;font-weight:500}
.say{font-family:var(--display);font-size:19px;line-height:1.5;min-height:1.5em}
.say .cur{display:inline-block;width:.5em;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.end{text-align:center;display:grid;gap:10px;padding-block:6px}
.end h2{font-size:26px;color:var(--ok)}
.mboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mbox{position:relative;background:#fff;border:3px solid #22303a;border-radius:10px;box-shadow:4px 4px 0 #22303a;padding:10px 8px;display:grid;justify-items:center;gap:4px;text-align:center;overflow:hidden}
.mbox svg{width:58px;height:20px}
.mbox b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.2}
.mbox .ds{font-size:12px;color:#5f6d73;line-height:1.35}
.mbox .ct{font-family:var(--mono);font-size:14px}
.mbox .st{font-size:12px;border-radius:999px;padding:1px 8px;background:#e9eee7;color:#5f6d73}
.mbox.active{border-color:#b08a1a;box-shadow:4px 4px 0 #b08a1a;background:#fffbe6}
.mbox.active .st{background:#ffd84a;color:#2b2410;font-weight:700}
.mbox.locked{background:#eef0ee;border-color:#9aa5a0;box-shadow:4px 4px 0 #9aa5a0;color:#7b8781}
.mbox.locked svg{filter:grayscale(1);opacity:.35}
.mbox.done .st{background:#dff1e7;color:#1f7a4d;font-weight:700}
.mbox .stampc{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border:4px solid #d23a2b;border-radius:50%;color:#d23a2b;display:grid;place-items:center;font-family:var(--display);font-size:22px;transform:rotate(-14deg);background:rgba(255,255,255,.55);pointer-events:none}
.mbox .stampc.new{animation:stampIn .45s cubic-bezier(.3,1.6,.5,1) both .25s}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.4);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:1}}
.mbox.opened{animation:openPulse 1s ease-out .7s 2}
@keyframes openPulse{50%{box-shadow:0 0 0 6px #ffd84a}}
.mlead{font-family:var(--display);font-size:19px;line-height:1.5;margin:0}
.hbtns{display:flex;gap:6px;align-items:center;flex:none}
.hbtn{border:2px solid #22303a;background:#fff;color:#22303a;border-radius:8px;padding:2px 10px;font-size:14px;font-family:var(--display)}
.hbtn.hot{background:#ffd84a}
.quest{flex-wrap:wrap} #qt{flex:1 1 210px;min-width:0}
.quest .reveal{margin-left:auto;flex:none;border:2px solid #2b2410;background:#fff;color:#2b2410;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.card-hint{background:#fff3c4;border:2px dashed #b08a1a;border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.card-hint .k{font-size:13px;color:#7a5a10}
.card-hint .v{font-family:var(--display);font-size:19px;line-height:1.45}
.mg{display:grid;gap:10px}
.mg canvas{width:100%;max-width:520px;justify-self:center;border:2px solid #22303a;border-radius:10px;background:#62bb61;touch-action:none}
.mg .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mg .prog{font-family:var(--mono);font-size:15px}
.mg .msgline{min-height:1.6em;font-weight:700}
.mg .msgline.ok{color:#1f7a4d} .mg .msgline.no{color:#d23a2b}
.url{font-family:var(--mono);font-size:15px;overflow-wrap:anywhere}
.lcard{background:#fff;border:1.5px solid #cfd8d2;border-radius:14px;overflow:hidden}
.lcard .top{background:#06a74a;color:#fff;font-size:13px;font-weight:700;padding:6px 12px}
.lcard .in{padding:12px;display:grid;gap:8px}
.lcard .tag2{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;background:#fbe4e0;color:#d23a2b;width:fit-content}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bubbles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:360px;justify-self:center;width:100%}
.bub{aspect-ratio:1;border-radius:50%;border:2px solid #9cc7dd;background:radial-gradient(circle at 35% 30%,#ffffff,#d7ecf5 60%,#9cc7dd);padding:0}
.bub.pop{background:#eef6fa;border-style:dashed;transform:scale(.82);transition:transform .12s}
.cup{justify-self:center;width:150px;height:200px;position:relative;border:4px solid #22303a;border-top:0;border-radius:0 0 26px 26px;background:#f7e7cf;overflow:hidden;cursor:pointer}
.cup .tea{position:absolute;left:0;right:0;bottom:0;height:62%;background:#c58a52}
.cup .foam{position:absolute;left:0;right:0;bottom:62%;background:repeating-linear-gradient(90deg,#fff8e8 0 10px,#fff1d2 10px 20px);transition:height .1s}
.cup .pearl{position:absolute;width:16px;height:16px;border-radius:50%;background:#2b1a12;bottom:6px}
.cup.shake{animation:shk .12s}
@keyframes shk{25%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(4px) rotate(3deg)}}
.meter{height:14px;border:2px solid #22303a;border-radius:8px;overflow:hidden;background:#fff}
.meter i{display:block;height:100%;background:#ffd84a;transition:width .1s}
.meter.zone{position:relative;background:linear-gradient(90deg,#fff 0 58%,#c9efd6 58% 82%,#fff 82%)}
.meter.zone i{background:rgba(255,216,74,.85)}
.pass{background:linear-gradient(135deg,#fffdf5,#fff3c4);border:3px solid #22303a;border-radius:16px;padding:16px;display:grid;gap:12px;position:relative;overflow:hidden}
.pass .ph{display:flex;gap:12px;align-items:center}
.pass .ph canvas{width:84px;height:96px;image-rendering:pixelated;background:linear-gradient(#bfe3ff 0 70%,#62bb61 70%);border:2px solid #22303a;border-radius:10px;flex:none}
.pass .ph h2{font-size:24px;color:#22303a}
.pass .ph .k{font-size:13px;color:#5f6d73;letter-spacing:.1em}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bdg{display:grid;justify-items:center;gap:2px;text-align:center;font-size:12px;color:#5f6d73;background:#fff;border:1.5px solid #cfd8d2;border-radius:10px;padding:8px 4px}
.bdg .ic{font-size:26px;line-height:1.1}
.bdg.off .ic{filter:grayscale(1);opacity:.35}
.bdg.on{border-color:#1f7a4d;color:#22303a}
.pass .stats{display:flex;gap:10px;flex-wrap:wrap}
.pass .stats div{background:#fff;border:1.5px solid #cfd8d2;border-radius:10px;padding:6px 12px;font-size:14px}
.pass .stats b{font-family:var(--mono);font-size:18px}
.pass .stamp2{display:inline-block;margin-top:6px;transform:rotate(-6deg);border:3px solid #d23a2b;color:#d23a2b;border-radius:10px;padding:2px 8px;font-family:var(--display);font-size:16px}
.end.bad h2{color:var(--pen)}

/* result */
.result{display:flex;flex-direction:column;gap:16px}
.slip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;display:grid;gap:10px;position:relative;overflow:hidden}
.slip .nm{color:var(--muted);font-size:14px}
.slip .score{font-family:var(--mono);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.slip .score small{font-size:22px;color:var(--muted)}
.slip h2{font-size:26px}
.slip canvas{width:96px;height:96px;image-rendering:pixelated;justify-self:center}
.stamp{position:absolute;right:14px;top:16px;transform:rotate(-12deg);border:3px solid var(--pen);color:var(--pen);border-radius:10px;padding:4px 10px;font-family:var(--display);font-size:20px;animation:thump .35s ease-out both}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
@keyframes thump{0%{transform:rotate(-12deg) scale(1.8);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:.9}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.panel h3{font-size:18px}
.recap{display:grid;gap:6px;font-size:14px;margin:0;padding:0;list-style:none}
.recap li{display:grid;grid-template-columns:1.4em 1fr;gap:6px}
.recap .y{color:var(--ok)} .recap .n{color:var(--pen)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>

    c.fillStyle='#9aa3ab'; c.fillRect(x+6.1*u,y-3.4*u,.8*u,.8*u);

/* ============ world: maps ============ */
const MAPS = {};
let M = null;
function newMap(id, name, W, H, base, solid, extra={}){
  const m = {id, name, W, H, TT:[], TP:[], TC:[], labels:[], warps:[], rooms:{}, hosts:[], chests:[], signs:[], hostIndex:new Map(), warpIndex:new Map(), off:null, offKey:'', ...extra};
  for(let y=0;y<H;y++){ m.TT.push(new Array(W).fill(solid?1:0)); m.TP.push(new Array(W).fill(base)); m.TC.push(new Array(W).fill(null)); }
  MAPS[id]=m; return m;
}
function mset(m,x,y,t,p,col){ if(x<0||y<0||x>=m.W||y>=m.H) return; m.TT[y][x]=t; m.TP[y][x]=p; if(col!==undefined) m.TC[y][x]=col; }
function mfill(m,x0,y0,x1,y1,t,p){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) mset(m,x,y,t,p); }
function addWarp(m,x,y,to,tx,ty,label,bld){ m.warps.push({x,y,to,tx,ty,label,bld}); }

/* ---- one wing of one floor ----
   local axes: u runs along the wing; v runs across it.
   v=0 outer wall on the corridor side, v=1-2 corridor, v=3 wall with doors, v=4..3+rh rooms, v=4+rh outer wall. */
function buildWing(m, tf, units, rh, opt){
  const V = 4+rh; let len = 1; units.forEach(u=>len += u.w+1);
  const S = (u,v,t,p) => { const [x,y]=tf(u,v); mset(m,x,y,t,p,opt.col); };
  for(let u=0;u<len;u++) for(let v=0;v<=V;v++){
    const edge = u===0 || u===len-1 || v===0 || v===V || v===3;
    if(edge) S(u,v,1,(v===0||v===V) && u>0 && u<len-1 && u%2===0 ? 'wallW' : 'wall');
    else if(v<=2) S(u,v,0,'hall'); else S(u,v,1,'wall');
  }
  if(opt.openStart) for(const v of [1,2]) S(0,v,0,'hall');
  let a = 1;
  for(const un of units){
    for(let u=a;u<a+un.w;u++) for(let v=4;v<=3+rh;v++) S(u,v,0, un.kind==='toilet'?'tilefloor' : un.kind==='passage'?'hall' : un.kind==='hall'?'hallfloor' : 'floor');
    furnish(S, un, a, rh, V);
    const c1=tf(a,4), c2=tf(a+un.w-1,3+rh);
    const r = {...un, u0:a, u1:a+un.w-1, tf, rh, V, bld:opt.bld, map:m.id,
      x0:Math.min(c1[0],c2[0]), x1:Math.max(c1[0],c2[0]), y0:Math.min(c1[1],c2[1]), y1:Math.max(c1[1],c2[1]), door:tf(a+1,4)};
    if(un.kind==='stairs') r.landing = tf(a+1,5);
    if(un.kind==='passage'){ r.near=[]; r.far=[]; for(let u=a;u<a+un.w;u++){ r.near.push(tf(u,0)); r.far.push(tf(u,V)); } }
    if(un.label && un.kind!=='blank' && un.kind!=='stairs') m.labels.push([un.label,(r.x0+r.x1+1)/2,r.y0+.55,.52]);
    if(un.kind==='stairs') m.labels.push(['樓梯',(r.x0+r.x1+1)/2,r.y0+.55,.45]);
    m.rooms[un.id] = r;
    a += un.w+1;
  }
  return {len, V};
}
function furnish(S, un, a, rh, V){
  const w=un.w, k=un.kind, vE=3+rh, mid=a+Math.floor((w-1)/2);
  const put=(u,v,p)=>S(u,v,1,p);
  if(k==='blank'){ for(let u=a;u<a+w;u++) for(let v=4;v<=vE;v++) put(u,v,'wall'); return; }
  if(k==='void'){ for(let u=a;u<a+w;u++){ put(u,3,'rail'); for(let v=4;v<=vE;v++) put(u,v,'void'); } return; }
  if(k==='stairs'){
    for(let u=a;u<a+w;u++) S(u,3,0,'hall');
    for(let v=4;v<=vE;v++){
      S(a+1,v,0,'landing');
      if(v===4){ S(a,v,0,'landing'); S(a+2,v,0,'landing'); continue; }
      un.up ? S(a,v,0,'stUp') : put(a,v,'rail');
      un.down ? S(a+2,v,0,'stDn') : put(a+2,v,'rail');
    }
    return;
  }
  if(k==='passage'){
    for(let u=a;u<a+w;u++){ S(u,3,0,'hall'); if(un.near) S(u,0,0,'exit'); if(un.far) S(u,V,0,'exit'); }
    for(let v=4;v<=vE;v++){ S(a-1,v,1,'bboard'); S(a+w,v,1,'bboard'); }
    return;
  }
  // ordinary room: one door (two for wide rooms)
  S(a+Math.min(1,w-1),3,0,'doorway'); if(w>=10) S(a+w-2,3,0,'doorway');
  const row = (v,p,skip=[]) => { for(let u=a;u<a+w;u+=2) if(!skip.includes(u)) put(u,v,p); };
  switch(k){
    case 'class': row(5,'desk'); if(rh>=5) row(7,'desk'); put(mid,vE,'tdesk'); for(let u=a+1;u<a+w-1;u++) S(u,V,1,'board'); break;
    case 'office': row(5,'pcdesk'); put(a,vE,'cabinet'); put(a+w-1,vE,'cabinet'); if(w>=8) row(vE,'pcdesk',[a,a+w-1]); break;
    case 'principal': put(mid,6,'bigdesk'); put(mid+1,6,'bigdesk'); put(a,vE,'sofa'); put(a+1,vE,'sofa'); put(a+w-1,4,'plant'); put(a+w-1,vE,'cabinet'); break;
    case 'toilet': for(let u=a;u<a+w;u++) put(u,vE,'stall'); put(a+w-1,4,'sink'); if(w>=4) put(a+w-1,5,'sink'); break;
    case 'library': for(let u=a;u<a+w;u++){ if((u-a)%4!==3) put(u,vE,'shelf'); } for(let u=a+1;u<a+w-1;u+=3) put(u,5,'rtable'); break;
    case 'music': put(a+w-1,vE,'piano'); if(w>=4) put(a+w-2,vE,'piano'); row(5,'chair'); break;
    case 'av': for(let u=a+1;u<a+w-1;u++) S(u,V,1,'screen'); row(5,'chair'); row(vE-1,'chair'); break;
    case 'hall': for(let u=a;u<a+w;u++) put(u,vE,'stage'); put(a+2,5,'hoop'); put(a+w-3,5,'hoop'); break;
    case 'pc': for(let u=a;u<a+w-1;u++){ put(u,5,'pcdesk'); put(u,vE,'pcdesk'); } put(a+w-1,vE,'tdesk'); break;
    case 'lab': for(let u=a+1;u<a+w-1;u++) put(u,5,'bench'); put(a,vE,'shelf'); put(a+w-1,vE,'sink'); break;
    case 'nurse': for(let u=a;u<a+w;u+=2) put(u,vE,'bed'); put(a+w-1,4,'cabinet'); break;
    case 'lounge': put(a,vE,'sofa'); put(a+1,vE,'sofa'); put(mid,5,'ctable'); put(a+w-1,4,'plant'); break;
    case 'gym': put(a,vE,'balls'); put(a+w-1,vE,'balls'); put(a,5,'cones'); put(a+w-1,6,'mat'); break;
    case 'archive': for(let u=a;u<a+w;u+=2){ put(u,5,'shelf'); put(u,vE,'shelf'); } break;
    case 'kinder': put(a,5,'toy'); put(a+2,7,'toy'); put(mid,vE,'tdesk'); break;
  }
}

function toast(msg){const el=$('.toast');if(!el)return;el.textContent=msg;el.hidden=false;clearTimeout(G.toastT);G.toastT=setTimeout(()=>el.hidden=true,2000)}
function onTap(e){
  if(G.state!=='walk') return;
  const r=G.cv.getBoundingClientRect(),x=e.clientX-r.left+G.cam.x,y=e.clientY-r.top+G.cam.y;
  const tx=Math.floor(x/G.T),ty=Math.floor(y/G.T); if(tx<0||ty<0||tx>=M.W||ty>=M.H) return;
  const sx=Math.round(G.p.x),sy=Math.round(G.p.y), gd=guide();
  const onArrow=G.arrow&&Math.hypot(e.clientX-r.left-G.arrow.x,e.clientY-r.top-G.arrow.y)<48;
  // tapping on or near the "!" (including its label just above) goes there
  if(gd&&(onArrow||(Math.abs(tx-gd.x)<=1&&ty>=gd.y-2&&ty<=gd.y+1))){
    const goals=gd.warp||walkable(gd.x,gd.y)?[[gd.x,gd.y]]:neighbors(gd.x,gd.y);
    if(!gd.warp&&Math.abs(sx-gd.x)+Math.abs(sy-gd.y)<=1){G.path=[];return arrived()}
    return goPath(sx,sy,goals);
  }
  const near=(o)=>o.map===M.id&&o.x===tx&&(o.y===ty||o.y===ty+1);
  const poi=CHESTS.find(near)||(near(VR)&&VR)||(S.mainDone&&S.side<SIDES.length&&near(SIDES[S.side])&&SIDES[S.side])||null;
  if(poi){ G.want=poi; if(Math.abs(sx-poi.x)+Math.abs(sy-poi.y)<=1){G.path=[];return arrived()} return goPath(sx,sy,neighbors(poi.x,poi.y)); }

    const doors=M.warps.filter(w=>w.bld===M.TP[ty][tx]).sort((a,b)=>(Math.abs(a.x-tx)+Math.abs(a.y-ty))-(Math.abs(b.x-tx)+Math.abs(b.y-ty)));

  if(!goals.length||bfs(sx,sy,goals)===null) return toast('那裡走不過去，點黃色的「！」或箭頭');

function goPath(sx,sy,goals){

function arrived(){

 {q:'要登入 Google 帳號，哪一個網址是真的？',opts:['accounts.google.com','accounts-google.com.verify.net','google.account-login.tw'],ok:0,why:['','網址真正的主人是最後面的 verify.net，前面的 google 只是偽裝。','Google 不會用 account-login.tw 這種網址。']},

function footballGame(){
  let r=0, busy=false, shot=null, t0=performance.now();
  const dl=sheet(`<div class="mg"><div class="meta"><span>校園闖關・第 1 站・操場</span><span class="prog" id="fbP"></span></div>
   <h2 style="font-size:22px">⚽ 射門・釣魚網址</h2>
   <p style="margin:0">隊長政凱：「老師，球門上掛了三個網址，只能把球踢進<b>真的網址</b>！小心守門員。」</p>
   <div class="q" id="fbQ"></div><canvas id="fbC" style="aspect-ratio:320/200"></canvas>
   <div class="choices" id="fbB"></div><div class="msgline" id="fbM"></div></div>`);
  const c=mgCanvas('fbC',320,200), ZX=[80,160,240];
  function setup(){const R=FB_ROUNDS[r];$('#fbP').textContent=`第 ${r+1}/3 球`;$('#fbQ').textContent=R.q;$('#fbM').textContent='';$('#fbM').className='msgline';
    $('#fbB').innerHTML=R.opts.map((o,i)=>`<button class="ch" data-z="${i}" type="button"><span class="k">${'ABC'[i]}</span><span class="url">${o}</span></button>`).join('');
    $('#fbB').querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>kick(+b.dataset.z))}
  const keeperX=t=>160+Math.sin(t*1.7)*95;
  function kick(z){ if(busy) return; busy=true; shot={z,t:performance.now()}; $('#fbB').querySelectorAll('button').forEach(b=>b.disabled=true); }
  function land(z){
    const R=FB_ROUNDS[r], saved=Math.abs(keeperX((performance.now()-t0)/1000)-ZX[z])<38, m=$('#fbM');
    if(z!==R.ok){ m.className='msgline no'; m.textContent=`球進了，但「${R.opts[z]}」是釣魚網址，不算分！${R.why[z]}`; }
    else if(saved){ m.className='msgline no'; m.textContent='網址選對了，可是被守門員撲出去！抓準時機再踢一次。'; }
    else { m.className='msgline ok'; m.textContent='GOAL！真的網址，漂亮進球！'; setTimeout(()=>{ r++; if(r>=FB_ROUNDS.length) return sideDone(0); busy=false; shot=null; setup(); },1300); return; }
    setTimeout(()=>{busy=false;shot=null;$('#fbB').querySelectorAll('button').forEach(b=>b.disabled=false)},900);
  }
  function drawF(){
    MG.raf=requestAnimationFrame(drawF); const t=(performance.now()-t0)/1000;
    c.fillStyle='#4caf50';c.fillRect(0,0,320,200); for(let i=0;i<6;i++){c.fillStyle=i%2?'#52b556':'#4caf50';c.fillRect(0,i*34,320,34)}
    c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(70,8,180,64);c.beginPath();c.arc(160,200,40,Math.PI,0);c.stroke();
    c.fillStyle='rgba(255,255,255,.35)';c.fillRect(40,14,240,56); c.strokeStyle='#fff';c.lineWidth=4;c.strokeRect(40,14,240,56);
    c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=1;for(let x=48;x<280;x+=8){c.beginPath();c.moveTo(x,14);c.lineTo(x,70);c.stroke()}
    ['A','B','C'].forEach((l,i)=>{c.fillStyle='#22303a';c.font='bold 16px sans-serif';c.textAlign='center';c.fillText(l,ZX[i],36);if(i){c.strokeStyle='#ffd84a';c.lineWidth=2;c.setLineDash([4,4]);c.beginPath();c.moveTo(40+80*i,14);c.lineTo(40+80*i,70);c.stroke();c.setLineDash([])}});
    const kx=keeperX(t); drawPerson(c,kx-12,74,1.6,P('short','#2b2320','#f2cf3b','#22303a'),{});
    c.fillStyle='#f2cf3b';c.fillRect(kx-22,52,8,6);c.fillRect(kx+14,52,8,6);
    let bx=160,by=172,br=9;
    if(shot){const k=Math.min(1,(performance.now()-shot.t)/520);bx=160+(ZX[shot.z]-160)*k;by=172-(172-48)*k;br=9-3*k;if(k>=1&&!shot.done){shot.done=true;land(shot.z)}}
    c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(bx,by+br,br,br*.35,0,0,7);c.fill();
    c.fillStyle='#fff';c.strokeStyle='#22303a';c.lineWidth=1.5;c.beginPath();c.arc(bx,by,br,0,7);c.fill();c.stroke();c.fillStyle='#22303a';c.beginPath();c.arc(bx,by,br*.35,0,7);c.fill();
  }
  setup(); drawF();
}

function basketballGame(){
  let r=0, stage='judge', pow=0, dir=1, shot=null, made=false;
  const dl=sheet(`<div class="mg"><div class="meta"><span>校園闖關・第 2 站・籃球場</span><span class="prog" id="bbP"></span></div>
   <h2 style="font-size:22px">🏀 投籃・真假帳號</h2>
   <p style="margin:0">教練：「先判斷傳訊息的是不是本人，判斷對了才能投籃！」</p><div id="bbBody"></div></div>`);
  function judge(){
    const R=BB_ROUNDS[r]; stage='judge'; stopMG(); $('#bbP').textContent=`第 ${r+1}/3 球`;
    $('#bbBody').innerHTML=`<div class="lcard"><div class="top">LINE・${R.sub}</div><div class="in"><div class="who"><div class="av">${R.name[0]}</div><strong>${R.name}</strong>${R.tag?`<span class="tag2">${R.tag}</span>`:''}</div><div class="bubble">${R.msg}</div></div></div>
      <div class="q">這則訊息是本人傳的嗎？</div><div class="two"><button class="ch" data-a="1" type="button"><span>是本人</span></button><button class="ch" data-a="0" type="button"><span>是冒名的</span></button></div><div class="msgline" id="bbM"></div>`;
    $('#bbBody').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
      const ok=(b.dataset.a==='1')===R.ok, m=$('#bbM');
      if(!ok){m.className='msgline no';m.textContent='判斷錯了！'+R.why+'再想想看。';return}
      shoot(R.why);
    });
  }
  function shoot(why){
    stage='shoot'; made=false; shot=null;
    $('#bbBody').innerHTML=`<div class="msgline ok">判斷正確！${why}</div><canvas id="bbC" style="aspect-ratio:320/200;background:#d6a768"></canvas>
      <div class="meter zone" aria-hidden="true"><i id="bbW"></i></div><p style="margin:0;font-size:14px;color:#5f6d73">力道條跑到中間的綠色區域時按「投籃！」</p>
      <button class="go" id="bbGo" type="button">投籃！</button><div class="msgline" id="bbM2"></div>`;
    const c=mgCanvas('bbC',320,200);
    $('#bbGo').onclick=()=>{ if(shot) return; shot={t:performance.now(),p:pow,good:pow>.58&&pow<.82}; };
    const draw=()=>{
      MG.raf=requestAnimationFrame(draw);
      if(!shot){pow+=dir*.011;if(pow>1){pow=1;dir=-1}if(pow<0){pow=0;dir=1}}
      $('#bbW').style.width=(pow*100)+'%'; $('#bbW').style.background=pow>.58&&pow<.82?'#4cb36a':'rgba(255,216,74,.85)';
      c.fillStyle='#d6a768';c.fillRect(0,0,320,200);c.fillStyle='rgba(0,0,0,.06)';for(let x=0;x<320;x+=20)c.fillRect(x,0,2,200);
      c.fillStyle='#e8a28a';c.fillRect(110,0,100,90);c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(110,0,100,90);c.beginPath();c.arc(160,90,34,0,Math.PI);c.stroke();
      c.fillStyle='#fff';c.fillRect(130,10,60,30);c.strokeStyle='#22303a';c.strokeRect(130,10,60,30);c.strokeStyle='#d23a2b';c.strokeRect(150,20,20,14);
      c.strokeStyle='#e8571f';c.lineWidth=3;c.beginPath();c.ellipse(160,46,14,5,0,0,7);c.stroke();
      c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1;for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(160+k*5,48);c.lineTo(160+k*3,62);c.stroke()}
      drawPerson(c,144,198,2,S.av,{});
      let bx=160,by=150,br=11;
      if(shot){const k=Math.min(1,(performance.now()-shot.t)/700), miss=!shot.good, endX=miss?(shot.p<.58?150:176):160, endY=miss&&shot.p<.58?70:44;
        bx=160+(endX-160)*k; by=150-(150-endY)*k-Math.sin(k*Math.PI)*60; br=11-4*k;
        if(k>=1&&!shot.done){shot.done=true;const m=$('#bbM2');
          if(shot.good){m.className='msgline ok';m.textContent='唰！空心進球！';$('#bbGo').disabled=true;setTimeout(()=>{r++;if(r>=BB_ROUNDS.length)return sideDone(1);judge()},1100)}
          else{m.className='msgline no';m.textContent=shot.p<.58?'力道太小，球沒碰到框！再投一次。':'力道太大，打板彈出來了！再投一次。';setTimeout(()=>{shot=null},700)}}}
      c.fillStyle='#e8701f';c.strokeStyle='#22303a';c.lineWidth=1.5;c.beginPath();c.arc(bx,by,br,0,7);c.fill();c.stroke();c.beginPath();c.moveTo(bx-br,by);c.lineTo(bx+br,by);c.moveTo(bx,by-br);c.lineTo(bx,by+br);c.stroke();
    };
    draw();
  }
  judge();
}

function usbGame(){
  let score=0, bad=0, left=40, slots=Array(9).fill(null), playing=false;
  sheet(`<div class="mg"><div class="meta"><span>校園闖關・第 4 站・健康中心</span><span class="prog" id="ubP"></span></div>

  G2.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s,f=slots[i];if(!f||!playing)return;slots[i]=null;paint(i);const m=$('#ubM');
    if(f.ok){score++;m.className='msgline ok';m.textContent=`打開「${f.n}」，是正常的作業檔。`}else{bad++;score=Math.max(0,score-1);m.className='msgline no';m.textContent=`糟糕！${f.why}（扣 1 分）`}

  $('#ubGo').onclick=()=>{ $('#ubGo').hidden=true; playing=true; score=0; left=40; slots.fill(null); for(let i=0;i<9;i++)paint(i); P_(); $('#ubM').textContent='';

      for(let i=0;i<9;i++) if(slots[i]&&Date.now()>slots[i].until){slots[i]=null;paint(i)}

      P_(); if(left<=0){playing=false;stopMG();slots.fill(null);for(let i=0;i<9;i++)paint(i);$('#ubM').className='msgline no';$('#ubM').textContent=`時間到！只點開 ${score} 個正常檔案，再插一次隨身碟試試看。`;$('#ubGo').hidden=false;$('#ubGo').textContent='再試一次'}
    },250);
  };
}

  sheet(`<div class="mg"><div class="meta"><span>寶箱・${ch.name}</span><span class="prog" id="bbaP">泡沫 0%</span></div><h2 style="font-size:22px">🧋 搖珍奶</h2>
   <p style="margin:0">一直點杯子，把珍奶搖出滿滿的泡沫！停下來泡沫會慢慢消失喔。</p>
   <div class="cup" id="cup" role="button" aria-label="點我搖珍奶"><div class="tea"></div><div class="foam" id="foam" style="height:0"></div>${[18,44,70,96,30,60,86,112].map((x,i)=>`<span class="pearl" style="left:${x}px;bottom:${6+(i>3?18:0)}px"></span>`).join('')}</div>
   <div class="meter"><i id="bbaW" style="width:0"></i></div><button class="alt" id="mgNo" type="button">先不玩了</button></div>`);
  let f=0, done=false; const cup=$('#cup');

  cup.onpointerdown=shake;
  MG.iv=setInterval(()=>{if(done)return;f=Math.max(0,f-1.2);$('#foam').style.height=(f*.36)+'%';$('#bbaW').style.width=f+'%';$('#bbaP').textContent=`泡沫 ${Math.round(f)}%`},100);
  $('#mgNo').onclick=closeDialog;
}

/* mission board: 主線 → 支線 → 寶藏 */
function phase(){const n=Object.keys(S.treasures).length;return !S.mainDone?0:S.side<SIDES.length?1:n<TOTAL_TREASURE?2:3}
function boardHTML(justDone){
  const ph=phase(), n=Object.keys(S.treasures).length, nb=SIDES.filter(q=>S.badges[q.id]).length, sc=S.log.filter(x=>x).length;
  const stOf=k=>k===0?(S.mainDone?'done':'active'):!S.mainDone?'locked':(k===1?S.side>=SIDES.length:n>=TOTAL_TREASURE)?'done':'active';
  const box=(k,icon,title,ds,ct)=>{const st=stOf(k);
    return `<div class="mbox ${st}${justDone===0&&k>0&&st==='active'?' opened':''}">${icon}<b>${title}</b><span class="ds">${ds}</span><span class="ct">${ct}</span><span class="st">${st==='done'?'已完成':st==='active'?'進行中':'🔒 尚未開啟'}</span>${st==='done'?`<span class="stampc${justDone===k?' new':''}">完成</span>`:''}</div>`};
  const heart='<svg viewBox="0 0 30 10" aria-hidden="true"><path d="M5 9S.5 6 .5 3.4C.5 1.6 1.8.6 3.1.6 4 .6 4.6 1.1 5 1.7 5.4 1.1 6 .6 6.9.6 8.2.6 9.5 1.6 9.5 3.4 9.5 6 5 9 5 9ZM15 9S10.5 6 10.5 3.4C10.5 1.6 11.8.6 13.1.6 14 .6 14.6 1.1 15 1.7 15.4 1.1 16 .6 16.9.6 18.2.6 19.5 1.6 19.5 3.4 19.5 6 15 9 15 9ZM25 9S20.5 6 20.5 3.4C20.5 1.6 21.8.6 23.1.6 24 .6 24.6 1.1 25 1.7 25.4 1.1 26 .6 26.9.6 28.2.6 29.5 1.6 29.5 3.4 29.5 6 25 9 25 9Z" fill="#d23a2b"/></svg>';
  const balls='<svg viewBox="0 0 30 10" aria-hidden="true"><circle cx="5" cy="5" r="4.3" fill="#fff" stroke="#22303a" stroke-width=".9"/><circle cx="5" cy="5" r="1.6" fill="#22303a"/><circle cx="16" cy="5" r="4.3" fill="#e8701f" stroke="#22303a" stroke-width=".9"/><path d="M11.7 5H20.3M16 .7V9.3" stroke="#22303a" stroke-width=".7"/><rect x="22.2" y="2.4" width="6.6" height="6" rx=".8" fill="#ffd84a" stroke="#22303a" stroke-width=".9"/><path d="M24 2.4V1.6a1.5 1.5 0 0 1 3 0v.8" fill="none" stroke="#22303a" stroke-width=".9"/></svg>';
  const chest='<svg viewBox="0 0 30 10" aria-hidden="true"><rect x="8" y="4" width="14" height="5.5" fill="#b5793e"/><rect x="7.6" y="1.6" width="14.8" height="2.8" fill="#8b5a2b"/><rect x="8" y="4.4" width="14" height=".8" fill="#ffd84a"/><rect x="14.1" y="3.6" width="1.8" height="2.6" fill="#ffd84a"/></svg>';
  return `<div class="mboard">${box(0,heart,'主線任務','從大門走到視聽教室',`${S.mainDone?sc+' 題答對':'第 '+Math.min(S.i+1,N)+'/'+N+' 關'}`)}${box(1,balls,'支線任務','校園闖關收集徽章',`${nb}/${SIDES.length} 站`)}${box(2,chest,'寶藏任務','找出校園裡的寶箱',`${n}/${TOTAL_TREASURE} 個`)}</div>`;
}
function openBoard(opts){
  const o=opts||{}, ph=phase();
  const n2=Object.keys(S.treasures).length, sd=S.side>=SIDES.length, td=n2>=TOTAL_TREASURE;
  const next=!S.mainDone?'主線任務':!sd&&!td?'支線任務和寶藏任務（可以同時進行）':!sd?'支線任務':!td?'寶藏任務':'';
  sheet(`<div class="end" style="text-align:left;gap:14px"><div class="meta"><span>任務卡</span><span>${esc(S.nick||'老師')}</span></div>
   ${o.title?`<h2>${o.title}</h2>`:''}
   ${boardHTML(o.justDone)}
   ${o.lead?`<p class="mlead">${o.lead}</p>`:next?`<p class="mlead">現在進行：<b>${next}</b></p>`:'<p class="mlead">三個任務全部完成！到迎曦樓一樓 104 國際教室領 VR 通行證吧。</p>'}
   ${o.extra||''}
   <button class="go" id="bdGo" type="button">${o.btn||'回到校園'}</button></div>`);
  $('#bdGo').onclick=o.onGo||closeDialog;
}
/* treasure clue map */
function openTreasureMap(){
  const n=Object.keys(S.treasures).length;
  sheet(`<div class="end" style="text-align:left"><div class="meta"><span>寶藏線索</span><span>已找到 ${n}/${TOTAL_TREASURE}</span></div>
   <h2 style="color:#22303a">🗺️ 寶藏藏身處</h2><p style="margin:0">先猜猜看在哪裡！真的找不到，再按「帶我去」，地圖上會出現黃色的「！」。</p>
   <div style="display:grid;gap:8px">${CHESTS.map(ch=>{const got=!!S.treasures[ch.id];return `<div style="display:flex;gap:10px;align-items:center;background:${got?'#dff1e7':'#fff'};border:1.5px solid ${got?'#1f7a4d':'#cfd8d2'};border-radius:10px;padding:8px 10px">
     <span style="font-size:22px">${got?'🎁':'❓'}</span><span style="flex:1;min-width:0">${got?`<b>${ch.name}</b>・已找到`:ch.clue}</span>
     ${got?'':`<button class="hbtn${S.seek===ch.id?' hot':''}" type="button" data-seek="${ch.id}">${S.seek===ch.id?'帶路中':'帶我去'}</button>`}</div>`}).join('')}</div>
   <button class="go" id="mgClose" type="button">回到校園</button></div>`);
  document.querySelectorAll('#dlg [data-seek]').forEach(b=>b.onclick=()=>{S.seek=b.dataset.seek;saveProg();closeDialog();toast('跟著黃色的「！」走，就能找到寶箱');});
  $('#mgClose').onclick=closeDialog;
}
/* the VR pass */
function openPass(atVR){
  if(atVR&&S.mainDone&&!S.vrAt){S.vrAt=Date.now();saveProg();report('到 104 領取 VR 通行證')}
  const sc=S.log.filter(x=>x).length, n=Object.keys(S.treasures).length, nb=SIDES.filter(q=>S.badges[q.id]).length;
  sheet(`<div class="pass">
    <div class="ph"><canvas id="pAv" width="84" height="96"></canvas><div><div class="k">東芳國小 資安研習</div><h2>VR 體驗通行證</h2><div style="font-family:var(--display);font-size:20px">${esc(S.nick||'老師')}</div>${atVR&&S.mainDone?'<span class="stamp2">104 國際教室 ✓</span>':''}</div></div>
    ${boardHTML()}
    ${S.mainDone&&n<TOTAL_TREASURE?'<button class="hbtn" type="button" id="toMap" style="justify-self:start">看寶藏線索</button>':''}
    <div class="badges">${SIDES.map(q=>`<div class="bdg ${S.badges[q.id]?'on':'off'}"><span class="ic">${q.icon}</span>${q.name}</div>`).join('')}</div>
    <p style="margin:0">${!S.mainDone?'先完成主線 10 關，抵達二樓視聽教室後，就能領取通行證。':atVR?'請把這個畫面給講師看，就能體驗 VR 眼鏡！':'完成主線了！隨時可以到迎曦樓一樓的 104 國際教室出示通行證。'}</p></div>
   <button class="go" id="mgClose" type="button">回到校園</button>`);
  const c=$('#pAv').getContext('2d'); c.imageSmoothingEnabled=false; drawPerson(c,2,94,5,S.av,{mood:'ok'});
  const tm=$('#toMap'); if(tm) tm.onclick=openTreasureMap;
  $('#mgClose').onclick=closeDialog;
}

/* keyboard control */
function bumpInto(x,y){
  const at=o=>o&&o.map===M.id&&o.x===x&&o.y===y;
  const sk=S.seek&&CHESTS.find(c=>c.id===S.seek);
  const poi=CHESTS.find(at)||(at(VR)&&VR)||null;
  if(poi){G.want=poi;return arrived()}
  const tg=goal(); if(at(tg)) return arrived();
  if(M===CAMPUS&&x===STRANGER.x&&y===STRANGER.y) return toast('陌生人：「我是廠商，來修電腦的……」');
  const tm=M===CAMPUS&&TEAM.find(h=>h.x===x&&h.y===y); if(tm) toast(`${tm.name}：「${tm.line}」`);
}
const KEYMAP={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
window.addEventListener('keydown',e=>{
  if(S.screen!=='rpg'||G.state!=='walk'||!G.cv) return;
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  if(e.code==='Space'){e.preventDefault();G.dash=true;return}
  const k=KEYMAP[e.key]; if(!k) return; e.preventDefault();
  if(!G.keyDir||G.keyDir[0]!==k[0]||G.keyDir[1]!==k[1]) G.bump=null;
  if(!G.keyDir) G.path=G.path.slice(0,1);
  G.keyDir=k; G.want=null;
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'){G.dash=false;return}
  const k=KEYMAP[e.key]; if(k&&G.keyDir&&G.keyDir[0]===k[0]&&G.keyDir[1]===k[1]){G.keyDir=null;G.bump=null}
});
window.addEventListener('blur',()=>{G.keyDir=null;G.dash=false});

/* ---------- RPG screens ---------- */
function rpgView(){
  return `<div id="rpg"><div class="rhud"><div class="rtop"><div class="clock"><span class="t" id="rt"></span><span class="p" id="rp"></span></div><div class="hbtns">${hearts()}<button class="hbtn" id="mapBtn" type="button" hidden>寶藏</button><button class="hbtn" id="taskBtn" type="button">任務卡</button><button class="hbtn" id="passBtn" type="button">通行證</button></div></div>
   <div class="quest" id="quest"><span class="tag">任務</span><span id="qt"></span></div></div>
   <div class="stage"><canvas id="cv" aria-label="校園地圖，點擊地圖讓角色移動"></canvas><div class="toast" hidden></div><div class="dlg" id="dlg" hidden></div></div></div>`;
}
function updateHud(){
  const q=$("#quest");
  if(S.mainDone){
    const all=S.side>=SIDES.length, ph=phase(), n=Object.keys(S.treasures).length;
    $("#rt").textContent="13:30"; $("#rp").textContent=!all?`支線第 ${S.side+1}/${SIDES.length} 站・寶藏 ${n}/${TOTAL_TREASURE}`:n<TOTAL_TREASURE?`支線完成・寶藏 ${n}/${TOTAL_TREASURE}`:'三個任務全部完成！';
    $("#qt").textContent=!all?SIDES[S.side].hint:n<TOTAL_TREASURE?'支線完成！繼續找寶箱（上方「寶藏」有線索），或到迎曦樓一樓 104 國際教室領通行證。':'最後一站：到迎曦樓一樓的 104 國際教室，領取 VR 體驗通行證！';
    const old=q.querySelector(".reveal"); old&&old.remove();
    if(!all&&!S.hint[S.side]){const b=document.createElement("button");b.className="reveal";b.type="button";b.textContent="看不懂？顯示位置";b.onclick=()=>{S.hint[S.side]=true;saveProg();updateHud()};q.appendChild(b)}
  } else {
    const s=SCENES[Math.min(S.i,N-1)];
    $("#rt").textContent=G.ending?"13:25":s.t; $("#rp").textContent=G.ending?"研習快開始了・東芳樓":`${s.p}・${s.loc}・第 ${S.i+1}/${N} 關`;
    $("#qt").textContent=G.ending?"教師尊榮專用電梯開放中！搭電梯（或走樓梯）上二樓視聽教室":s.quest;
  }
  const mb=$("#mapBtn"); if(mb) mb.hidden=!S.mainDone;
  q.classList.remove("pulse"); void q.offsetWidth; q.classList.add("pulse");
  $(".rhud .hearts").outerHTML=hearts();
}
let typeTimer=0;
function typeInto(el,text,done){
  clearInterval(typeTimer); let k=0; el.innerHTML='<span></span><span class="cur">▌</span>';
  const sp=el.firstChild, finish=()=>{clearInterval(typeTimer);sp.textContent=text;el.lastChild.remove();el.onclick=null;done&&done()};
  el.onclick=finish;
  typeTimer=setInterval(()=>{k+=1;sp.textContent=text.slice(0,k);if(k>=text.length)finish()},28);
}
function openEvent(){
  G.path=[]; G.keyDir=null; G.state="dialog";
  const dl=$("#dlg"); dl.hidden=false;
  if(G.ending){ return showEnding() }
  const s=SCENES[S.i]; S.picked=null; S.order=shuffle([0,1,2]);
  dl.innerHTML=`<div class="meta"><span><b>${s.t}</b> ${s.p}</span><span>${s.loc}</span></div><div class="say" id="say"></div><div id="rest" hidden></div>`;
  typeInto($("#say"),s.say,()=>{const r=$("#rest");if(!r)return;r.hidden=false;renderEventRest()});
  dl.scrollTop=0;
}
function renderEventRest(){
  const s=SCENES[S.i], r=$("#rest"), done=S.picked!==null, last=S.i===N-1;
  r.innerHTML=`<div style="display:grid;gap:12px"><div class="msg">${sceneBody(s)}</div><div class="q">${s.q}</div>${choicesHTML(s)}${feedbackHTML(s)}
   ${done?`<button class="go" id="cont">${S.hearts===0?"看看今天的下場":"繼續走"}</button>`:""}</div>`;
  r.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
    const ok=answer(+b.dataset.k); G.mood=ok?"ok":"bad"; G.moodT=performance.now()/1000+2.5;
    renderEventRest(); $(".rhud .hearts").outerHTML=hearts();
    const f=r.querySelector(".fb"); f&&f.scrollIntoView({behavior:"smooth",block:"start"});
  });
  const ct=$("#cont"); if(ct) ct.onclick=()=>{
    if(S.hearts===0){ showGameOver(); return }
    S.i++; if(S.i>=N){G.ending=true}
    closeDialog(); saveProg();
  };
}
function closeDialog(){stopMG();clearInterval(typeTimer);const dl=$("#dlg");dl.hidden=true;dl.innerHTML="";G.state="walk";S.picked=null;updateHud()}
function showGameOver(){
  const dl=$("#dlg");
  dl.innerHTML=`<div class="end bad"><h2>三顆心用完了</h2><p style="margin:0">主任把你請到教務處：「先把事件檢討報告寫完再去研習。」你寫了整整三頁……</p><p style="margin:0;color:#5f6d73">寫完了！剩下的關卡還是要完成，才能到視聽教室喔。</p><button class="go" id="goOn">寫完報告，繼續上班</button></div>`;
  dl.scrollTop=0; $("#goOn").onclick=()=>{S.i++;if(S.i>=N)G.ending=true;closeDialog()};
}
function showEnding(){
  const sc=S.log.filter(x=>x).length;
  S.mainDone=true; G.ending=false; S.mainDoneAt=S.mainDoneAt||Date.now(); saveProg(); report('完成主線，抵達視聽教室');
  openBoard({justDone:0,title:'恭喜您完成考驗！',
    lead:`準時抵達視聽教室！但研習結束才能下班！主線答對 ${sc}/${N} 關。<br><b>支線任務和寶藏任務都開啟了！</b>支線有 6 個闖關站，每一站都會拿到下一站的提示卡；寶藏有 8 個寶箱，上方「寶藏」按鈕有藏身線索。`,
    extra:`<div class="card-hint"><span class="k">提示卡 1</span><span class="v">${SIDES[0].hint}</span></div><p style="margin:0;color:#5f6d73">迎曦樓一樓的 104 國際教室也開放了，隨時可以去領「VR 體驗通行證」。</p>`,
    btn:'開始支線和寶藏任務',onGo:()=>{closeDialog();toast("提示卡在上方任務列，看不懂可以按「顯示位置」")}});
}
function finish(){
  cancelAnimationFrame(G.raf); window.removeEventListener("resize",resize);
  S.screen="result"; render(); window.scrollTo({top:0});
}
function startRPG(){
  M=CAMPUS; G.p={x:36,y:64}; makeNpcs(); ballReset(); G.goals=0; G.baskets=0; G.path=[]; G.ending=false;
  S.resume0=!!S.resume; if(S.resume){const p=S.resume;S.resume=null;if(MAPS[p.map]){M=MAPS[p.map];G.p={x:p.x,y:p.y}}G.ending=!!p.ending&&!S.mainDone} G.state="walk"; G.dir=1; G.moodT=0; G.fade=0;
  $("#app").innerHTML=rpgView(); $("#passBtn").onclick=()=>openPass(false); $("#taskBtn").onclick=()=>openBoard(); $("#mapBtn").onclick=openTreasureMap;
  G.cv=$("#cv"); G.ctx=G.cv.getContext("2d");
  resize(); camUpdate(true); updateHud();
  G.cv.addEventListener("pointerdown",onTap);
  window.addEventListener("resize",resize);
  try{document.fonts&&document.fonts.ready.then(()=>{for(const m of Object.values(MAPS))m.offKey="";if(G.cv)resize()})}catch(e){}
  cancelAnimationFrame(G.raf); G.last=0; G.raf=requestAnimationFrame(frame);
  if(!S.resume0&&!S.mainDone&&S.i===0&&!S.log.length) openBoard({title:'今天有三個任務！',lead:'先完成<b>主線任務</b>，<b>支線任務</b>和<b>寶藏任務</b>就會同時開啟。每完成一個任務，就會在這張卡上蓋章。',btn:'出發！先完成主線任務',onGo:()=>{closeDialog();toast(window.matchMedia&&matchMedia('(pointer:fine)').matches?'方向鍵或 WASD 走路，按住空白鍵衝刺；也可以點黃色的「！」':'點黃色的「！」，角色會自己走過去')}});
  else toast("點黃色的「！」，角色會自己走過去");
}

/* ---------- top-level render ---------- */
function render(){
  const app=$("#app");
  if(S.screen==="start"){app.innerHTML=startView();paintLooks()}
  else if(S.screen==="card") app.innerHTML=cardView();
  else if(S.screen==="rpg"){startRPG();return}
  else {app.innerHTML=resultView();const rc=$("#rcv");if(rc){const c=rc.getContext("2d");c.imageSmoothingEnabled=false;drawPerson(c,0,96,6,S.av,{mood:tier(S.log.filter(x=>x).length,S.hearts===0).mood})}}
  bind();
}
function newRound(){S.i=0;S.hearts=MAXH;S.picked=null;S.log=[];S.order=shuffle([0,1,2]);S.mainDone=false;S.side=0;S.badges={};S.treasures={};S.hint={};S.seek=null;S.startAt=null;S.mainDoneAt=null;S.sideDoneAt=null;S.vrAt=null}
function bind(){
  const begin=mode=>{S.nick=$("#nick").value.trim();const r=load();r.nick=S.nick;r.av=S.av;save(r);clearInterval(pvTimer);newRound();S.startAt=Date.now();S.mode=mode;S.screen=mode;render();window.scrollTo({top:0});report(mode==='card'?'開始遊戲（簡易版）':'開始遊戲')};
  const st=$("#start"); if(st) st.onclick=()=>{try{localStorage.removeItem(PKEY)}catch(e){};begin("rpg")};
  const rs=$("#resume"); if(rs) rs.onclick=()=>{const p=loadProg();S.nick=$("#nick").value.trim()||p.nick||"";const r=load();r.nick=S.nick;r.av=S.av;save(r);clearInterval(pvTimer);
    Object.assign(S,{i:p.i,hearts:p.hearts,log:p.log||[],mainDone:!!p.mainDone,side:p.side||0,badges:p.badges||{},treasures:p.treasures||{},hint:p.hint||{},seek:p.seek||null,startAt:p.startAt||Date.now(),mainDoneAt:p.mainDoneAt||null,sideDoneAt:p.sideDoneAt||null,vrAt:p.vrAt||null,picked:null});
    S.resume=p; S.mode="rpg"; S.screen="rpg"; render(); window.scrollTo({top:0}); report('繼續上次進度')};
  const sm=$("#simple"); if(sm) sm.onclick=()=>begin("card");
  document.querySelectorAll(".scene .ch").forEach(b=>b.onclick=()=>{answer(+b.dataset.k);render();const f=$(".fb");f&&f.scrollIntoView({behavior:"smooth",block:"center"})});
  const nx=$("#next"); if(nx) nx.onclick=()=>{
    if(S.hearts===0||S.i===N-1){S.screen="result";render();window.scrollTo({top:0});return}
    S.i++;S.picked=null;S.order=shuffle([0,1,2]);render();window.scrollTo({top:0});
  };
  const ag=$("#again"); if(ag) ag.onclick=()=>{S.screen="start";render();window.scrollTo({top:0})};
}
(function init(){const r=load();S.av=(r.av&&typeof r.av.hair==="string")?{...DEFAULT_LOOK,...r.av}:{...DEFAULT_LOOK};S.order=shuffle([0,1,2]);render()})();
</script>
